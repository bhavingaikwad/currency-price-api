openapi: 3.0.3
info:
  title: Currency and Price Aggregation API
  version: 0.0.1
  description: Latest exchange rate per currency pair, from ECB reference rates and Binance 1-minute klines. All routes except token and health need a Bearer JWT.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/token:
    post:
      summary: Exchange a username and password for a 30-minute JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string }
                  expiresInSeconds: { type: integer, example: 1800 }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/rates/latest-naive:
    get:
      summary: Latest rate per pair, one query per pair (N+1 baseline). Role USER.
      parameters: [{ $ref: '#/components/parameters/provider' }]
      responses:
        '200': { $ref: '#/components/responses/Rates' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/rates/latest:
    get:
      summary: Latest rate per pair in one indexed query. Role USER.
      parameters: [{ $ref: '#/components/parameters/provider' }]
      responses:
        '200': { $ref: '#/components/responses/Rates' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/rates/latest-cached:
    get:
      summary: Latest rate per pair through the Redis cache. Role USER.
      parameters: [{ $ref: '#/components/parameters/provider' }]
      responses:
        '200': { $ref: '#/components/responses/Rates' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /api/v1/admin/ingest:
    post:
      summary: Fetch the latest rates for a provider and store the new ones (idempotent). Role ADMIN.
      parameters: [{ $ref: '#/components/parameters/provider' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, quotes]
              properties:
                base: { type: string, example: USD }
                quotes:
                  type: array
                  items: { type: string }
                  example: [EUR, GBP, JPY]
      responses:
        '200':
          description: Counts of fetched and newly stored rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string }
                  fetched: { type: integer }
                  stored: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /actuator/health/readiness:
    get:
      summary: Readiness (database and app state), used by the load balancer
      security: []
      responses:
        '200': { description: UP }
  /actuator/metrics:
    get:
      summary: Metric names, including rates.cache and rates.ingest. Role ADMIN.
      responses:
        '200': { description: List of metric names }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    provider:
      name: provider
      in: query
      required: true
      schema: { type: string, enum: [ECB, BINANCE] }
  responses:
    Rates:
      description: Latest rate per currency pair
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Rate' }
    Problem:
      description: Problem details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Rate:
      type: object
      properties:
        source: { type: string, example: EUR }
        target: { type: string, example: USD }
        value: { type: number }
        rateTime: { type: string, format: date-time }
        provider: { type: string }
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
