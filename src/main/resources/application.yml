spring:
  data:
    redis:
      timeout: 200ms
      connect-timeout: 200ms
  application:
    name: currency-price-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:currency}
    username: ${POSTGRES_USER:currency}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

rates:
  frankfurter:
    base-url: https://api.frankfurter.dev
    connect-timeout: 2s
    read-timeout: 5s

app:
  security:
    jwt-secret: ${JWT_SECRET}
    reader-password: ${READER_PASSWORD}
    admin-password: ${ADMIN_PASSWORD}
    token-ttl: 30m
